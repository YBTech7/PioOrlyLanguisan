
name: Deploy React Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check API and TypeScript
        run: |
          npm run lint
          npm run test:api

      - name: Build website
        env:
          VITE_API_BASE_URL: https://welcome-page-production-6941f322.up.railway.app
          VITE_BASE_PATH: /PioOrlyLanguisan/
        run: npm run build

      - name: Verify production files
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Development entry detected"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
